runtime: python313
entrypoint: serve

handlers:
  # Serve static assets
  - url: /assets
    static_dir: assets

  - url: /favicon.ico
    static_files: favicon.ico
    upload: favicon.ico

  # Other static by extension
  - url: /(.*\.(js|css|png|jpg|jpeg|gif|svg|ico|json|woff2?))
    static_files: \1
    upload: (.*\.(js|css|png|jpg|jpeg|gif|svg|ico|json|woff2?))

  # SPA fallback to index.html for all other routes
  - url: /.*
    static_files: index.html
    upload: index.html