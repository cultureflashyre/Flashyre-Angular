<!-- Mobile hamburger toggle -->
<button class="sidebar-mobile-toggle" (click)="toggleMobileMenu()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>

<!-- Backdrop for mobile -->
<div class="sidebar-backdrop" *ngIf="isMobileMenuOpen" (click)="toggleMobileMenu()"></div>

<aside class="sidebar" [class.open]="isMobileMenuOpen">
  <!-- Brand -->
  <div class="brand">
    <img src="assets/main-logo/logo - flashyre(1500px)-200h.png" alt="Flashyre Logo" style="height: 32px; object-fit: contain; margin-left: 8px;">
  </div>

  <!-- Workspace Nav -->
  <div class="nav-section">
    <div class="nav-label">Workspace</div>

    <a *ngIf="isSuperUser" routerLink="/recruiter-super-admin-analytical-module" routerLinkActive="active" class="nav-item" (click)="isMobileMenuOpen = false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>

    <a *ngIf="isSuperUser" routerLink="/recruiter-workflow-bulk-import" routerLinkActive="active" class="nav-item" (click)="isMobileMenuOpen = false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Import
    </a>

    <a routerLink="/recruiter-workflow-requirement" routerLinkActive="active" class="nav-item" (click)="isMobileMenuOpen = false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
      Requirements
    </a>

    <a *ngIf="showClients" routerLink="/recruiter-workflow-client" routerLinkActive="active" class="nav-item" (click)="isMobileMenuOpen = false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Clients
    </a>

    <a *ngIf="showCandidates" routerLink="/recruiter-workflow-candidate" routerLinkActive="active" class="nav-item" (click)="isMobileMenuOpen = false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Candidates
    </a>
  </div>

  <!-- Insights Nav -->
  <div class="nav-section">
    <div class="nav-label">Insights</div>

    <a *ngIf="showCandidates" routerLink="/job-matching-score" routerLinkActive="active" class="nav-item" (click)="isMobileMenuOpen = false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      Job Matching
    </a>

    <a *ngIf="showCandidates" routerLink="/collection-forms" routerLinkActive="active" class="nav-item" (click)="isMobileMenuOpen = false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h4"/></svg>
      Collection Forms
    </a>
  </div>

  <!-- Account Nav -->
  <div class="nav-section">
    <div class="nav-label">Account</div>
    <a class="nav-item" (click)="onLogout(); isMobileMenuOpen = false" style="cursor: pointer;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
      Logout
    </a>
  </div>

  <!-- User Chip -->
  <div class="sidebar-foot">
    <div class="user-chip">
      <div class="avatar" *ngIf="!profilePicUrl">{{ userInitials }}</div>
      <img *ngIf="profilePicUrl" [src]="profilePicUrl" class="avatar" alt="Profile Picture" style="object-fit: cover;">
      <div class="user-meta">
        <div class="user-name">{{ userName }}</div>
        <div class="user-org">{{ formattedUserType }}</div>
      </div>
    </div>
  </div>
</aside>
